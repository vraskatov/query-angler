[project]
name = "queryangler"
version = "0.1.0"
description = "Query Angler: RAG-basierter SQL-Tutor auf Grundlage des Wikibooks „Einführung in SQL“"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "chromadb>=1.0",
    "sentence-transformers>=3.0",
    "torch>=2.4",  # direkt angegeben, damit die CPU-Quelle unten greift
    "fastapi>=0.115",
    "snowballstemmer>=2.2",  # Wortstämme für die Stichwortsuche (BSD-3)
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",  # Datei-Uploads in FastAPI
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ipykernel>=6",
]

# PyTorch als reine CPU-Version: Die GPU bleibt für das Sprachmodell frei,
# und die mehrere Gigabyte großen CUDA-Bibliotheken entfallen.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/queryangler"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
