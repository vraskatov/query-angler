<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <title>Query Angler</title>
    <script>
      // Gespeicherte Wahl hell/dunkel vor dem ersten Zeichnen setzen (sonst blitzt die Seite auf)
      try {
        const theme = localStorage.getItem("queryangler-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
