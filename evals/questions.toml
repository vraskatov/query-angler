  "Relationale Datenbanken > Verknüpfungen und Schlüssel",
]

[[question]]
id = "alles-oder-nichts"
group = "im_buch"
question = "Wie sorge ich dafür, dass mehrere Änderungen entweder alle oder gar nicht gespeichert werden?"
gold = ["TCL - Ablaufsteuerung"]
