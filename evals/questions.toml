# Testfragen für die Evals.
#
# group:
#   im_buch      Das Buch beantwortet die Frage. Erwartet: richtige Antwort mit Quelle.
#   nah_dran     SQL-Thema, das das Buch nicht erklärt (geprüft gegen alle Chunks;
#                manche Begriffe stehen nur in der Liste der Schlüsselwörter). Erwartet: Absage.
#   fremd        Kein SQL-Thema. Erwartet: Absage.
#   sokratisch   Aufgabe im sokratischen Modus. Erwartet: Hinweis und Frage, ohne Lösung.
#
# gold:          Abschnitte, von denen mindestens einer gefunden werden muss, als
#                "Kapitel > Abschnitt". Ein Eintrag passt auch auf alle Unterabschnitte.
# keywords_all:  Begriffe, die in einer richtigen Antwort alle vorkommen müssen.
# keywords_any:  Begriffe, von denen mindestens einer vorkommen muss.
# mode:          optional "sokratisch" oder "erklaeren"; Standard: sokratisch nur in der
#                Gruppe "sokratisch".

# --- Im Buch -----------------------------------------------------------------

[[question]]
id = "where-having"
group = "im_buch"
question = "Was unterscheidet WHERE von HAVING?"
gold = [
  "Gruppierungen > Erweiterungen > Ergebnis mit HAVING einschränken",
  "Ausführliche SELECT-Struktur > Having Clause – HAVING-Klausel",
]
keywords_all = ["GROUP BY"]

[[question]]
id = "abteilungen-pro-ort"
group = "im_buch"
question = "Wie zähle ich, wie viele Abteilungen es pro Ort gibt?"
gold = ["Gruppierungen > Gruppierung bei einer Tabelle"]
keywords_all = ["GROUP BY", "COUNT"]

[[question]]
id = "staedte-pro-land"
group = "im_buch"
question = "Wie zähle ich, wie viele Städte es pro Land gibt?"
gold = [
  "Gruppierungen > Gruppierung bei einer Tabelle",
  "Funktionen > Spaltenfunktionen > COUNT – Anzahl",
]
keywords_all = ["GROUP BY", "COUNT"]

[[question]]
id = "inner-left-join"
group = "im_buch"
question = "Was ist der Unterschied zwischen INNER JOIN und LEFT OUTER JOIN?"
gold = [
  "OUTER JOIN > LEFT OUTER JOIN",
  "OUTER JOIN > Allgemeine Hinweise zu OUTER JOIN",
  "Mehrere Tabellen > OUTER JOIN - auch null-Werte zurückgeben",
]
keywords_all = ["LEFT"]

[[question]]
id = "leere-spalte"
group = "im_buch"
question = "Wie finde ich Zeilen, in denen eine Spalte keinen Wert enthält?"
gold = ["WHERE-Klausel im Detail > Eine einzelne Bedingung > IS NULL – null-Werte prüfen"]
keywords_all = ["IS NULL"]

[[question]]
id = "doppelte-zeilen"
group = "im_buch"
question = "Wie verhindere ich doppelte Zeilen im Ergebnis?"
gold = [
  "DML (1) - Daten abfragen > DISTINCT – Keine doppelten Zeilen",
  "Nützliche Erweiterungen > DISTINCT – keine doppelten Einträge",
]
keywords_all = ["DISTINCT"]

[[question]]
id = "absteigend-sortieren"
group = "im_buch"
question = "Wie sortiere ich das Ergebnis absteigend?"
gold = [
  "DML (1) - Daten abfragen > ORDER BY – Sortieren",
  "Ausführliche SELECT-Struktur > Order By Clause – ORDER BY-Klausel",
]
keywords_all = ["ORDER BY", "DESC"]

[[question]]
id = "erste-zehn-zeilen"
group = "im_buch"
question = "Wie begrenze ich die Ausgabe auf die ersten zehn Zeilen?"
gold = ["Nützliche Erweiterungen > Beschränkung auf eine Anzahl Zeilen"]
keywords_any = ["LIMIT", "TOP", "FIRST", "ROWNUM", "ROWS"]

[[question]]
id = "namen-beginnen-mit"
group = "im_buch"
question = "Wie finde ich alle Namen, die mit 'Sch' beginnen?"
gold = ["WHERE-Klausel im Detail > Eine einzelne Bedingung > LIKE – Ähnlichkeiten (1)"]
keywords_all = ["LIKE", "%"]

[[question]]
id = "fremdschluessel"
group = "im_buch"
question = "Was ist ein Fremdschlüssel?"
gold = [
