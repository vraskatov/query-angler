# Das Buch zeigt beide Wege, nennt FROM/WHERE "traditionell" und JOIN "modern". Ob die
# Antwort JOIN nennt, hängt davon ab, welche Abschnitte das Retrieval findet: Die Einstufung
# steht am Kapitelanfang, nicht neben dem alten Beispiel.
[[question]]
id = "drei-tabellen"
group = "im_buch"
question = "Wie verknüpfe ich drei Tabellen in einer Abfrage?"
gold = [
  "Arbeiten mit JOIN > INNER JOIN mehrerer Tabellen",
  "Einfache Tabellenverknüpfung > Mehrere Tabellen verbinden",
  "Mehrere Tabellen",
]
keywords_all = ["JOIN"]

# Folgefrage: allein findet "Und mit drei Tabellen?" nichts, mit der vorigen Frage schon.
[[question]]
id = "folge-drei-tabellen"
group = "im_buch"
question = "Und wie geht das mit drei Tabellen?"
history = [
  { question = "Was macht ein INNER JOIN?", answer = "Ein INNER JOIN verknüpft zwei Tabellen und liefert nur die Zeilen, zu denen es in beiden Tabellen passende Werte gibt." },
]
gold = [
  "Arbeiten mit JOIN > INNER JOIN mehrerer Tabellen",
  "Einfache Tabellenverknüpfung > Mehrere Tabellen verbinden",
  "Mehrere Tabellen",
]
keywords_all = ["JOIN"]

# "Spicken": dieselbe dritte Runde wie s-dialog-syntax, aber im Modus Erklären. Die Suche
# muss über die erste Frage beim Thema JOIN bleiben, die Antwort die Schreibweise zeigen.
[[question]]
id = "folge-spicken-syntax"
group = "im_buch"
question = "Mir fehlt die Syntax"
history = [
  { question = "Wie mache ich einen JOIN zwischen zwei Tabellen?", answer = "Hinweis: Zwei Tabellen lassen sich nur sinnvoll verbinden, wenn sie etwas gemeinsam haben.\nFrage: Welche Spalte kommt in beiden Tabellen vor?" },
  { question = "Es gibt eine Spalte fahrzeug_id in beiden. Aber wie mache ich jetzt einen JOIN?", answer = "Hinweis: Du hast zwei Listen, die über eine gemeinsame Nummer zusammengehören.\nFrage: Welche Spalte in beiden Tabellen könnte diese Verbindung sein?" },
]
gold = ["Arbeiten mit JOIN", "Mehrere Tabellen", "Ausführliche SELECT-Struktur"]
keywords_all = ["JOIN", "ON"]

