[[question]]
id = "automatische-nummer"
group = "im_buch"
question = "Wie lege ich eine Spalte an, die automatisch hochzählt?"
gold = [
  "DDL - Einzelheiten > Definition einer einzelnen Spalte > AUTO_INCREMENT – automatischer Zähler",
  "DDL - Struktur der Datenbank > Ergänzungen zu Tabellen > IDENTITY – auch ein automatischer Zähler",
  "DDL - Struktur der Datenbank > Ergänzungen zu Tabellen > SEQUENCE – Ersatz für automatischen Zähler",
]
keywords_any = ["AUTO_INCREMENT", "IDENTITY", "SEQUENCE"]

[[question]]
id = "datensatz-einfuegen"
group = "im_buch"
question = "Wie füge ich einen neuen Datensatz in eine Tabelle ein?"
gold = ["DML (2) - Daten speichern > INSERT – Daten einfügen"]
keywords_all = ["INSERT"]

