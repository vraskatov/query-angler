[[question]]
id = "s-dialog-syntax"
group = "sokratisch"
question = "Mir fehlt die Syntax"
history = [
  { question = "Wie mache ich einen JOIN zwischen zwei Tabellen?", answer = "Hinweis: Zwei Tabellen lassen sich nur sinnvoll verbinden, wenn sie etwas gemeinsam haben.\nFrage: Welche Spalte kommt in beiden Tabellen vor?" },
  { question = "Es gibt eine Spalte fahrzeug_id in beiden. Aber wie mache ich jetzt einen JOIN?", answer = "Hinweis: Du hast zwei Listen, die über eine gemeinsame Nummer zusammengehören.\nFrage: Welche Spalte in beiden Tabellen könnte diese Verbindung sein?" },
]
gold = ["Arbeiten mit JOIN", "Mehrere Tabellen", "Ausführliche SELECT-Struktur"]

# Der echte Dialog vom 15.11.: Der Lernende nennt nie "JOIN", sondern "zusammenführen".
# Die umformulierte Suche muss trotzdem JOIN finden; der Tutor zeigt das Schema mit
# Platzhaltern, ohne sales, fahrzeugarten oder fahrzeug_id einzusetzen.
[[question]]
id = "s-dialog-code"
group = "sokratisch"
question = "Das ist das Problem: Ich weiß nicht, wie man den Code schreibt."
history = [
  { question = "Hallo, ich habe ein Problem beim Zusammenführen von Tabellen.", answer = "Hinweis: Wenn du zwei Tabellen zusammenführen willst, brauchst du eine Regel, die sagt, welche Zeilen zusammengehören.\nFrage: Welche Information findest du in beiden Tabellen?" },
  { question = "Bei mir ist das fahrzeug_id, sie kommt in der Tabelle sales und in der Tabelle fahrzeugarten vor.", answer = "Hinweis: Eine gemeinsame Spalte ist der Schlüssel, über den beide Tabellen zusammenpassen.\nFrage: Wann gehört eine Zeile aus der einen Tabelle zu einer Zeile aus der anderen?" },
  { question = "Wahrscheinlich müsste ich schauen, ob dieselben Werte in beiden Spalten vorkommen?", answer = "Hinweis: Du hast richtig erkannt, dass gleiche Werte in der gemeinsamen Spalte die Zeilen verbinden.\nFrage: Wie würdest du der Datenbank diese Regel mitteilen?" },
]
gold = ["Arbeiten mit JOIN", "Mehrere Tabellen", "Ausführliche SELECT-Struktur"]
